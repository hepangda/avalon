name: Release
run-name: ${{ inputs.commit_title || format('Release {0}', inputs.commit) }}

# Releases are explicitly requested by commit; pushing a tag does not deploy.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA on main, or main for its latest commit
        required: true
        type: string
      restart:
        description: Restart the application even if this version is already running
        type: boolean
        default: false
      commit_title:
        description: Commit title supplied automatically by Release (manual)
        type: string
        required: false
      prepare_only:
        description: Build and publish assets without changing the running deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate commit
        id: resolve
        env:
          TARGET: ${{ inputs.commit }}
        run: |
          commit=$(bash deploy/release/resolve-commit.sh "$TARGET")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  release:
    needs: [resolve, checks]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    env:
      VERSION: sha-${{ needs.resolve.outputs.commit }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      STATIC_ASSET_BASE_URL: ${{ vars.STATIC_ASSET_BASE_URL }}
      STATIC_R2_BUCKET: ${{ vars.STATIC_R2_BUCKET }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set image repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_REPOSITORY=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # ARM-specific tags cannot accidentally reuse a historical amd64 build.
      - name: Find an image built from this commit
        id: existing
        run: |
          ref="$IMAGE_REPOSITORY:sha-$COMMIT-arm64"
          if docker pull --platform linux/arm64 "$ref"; then
            metadata=$(docker image inspect "$ref")
            if jq -e --arg base "$STATIC_ASSET_BASE_URL" --arg commit "$COMMIT" '
              .[0] | .Architecture == "arm64" and .Os == "linux" and
              .Config.Labels["avalon.runtime"] == "rust" and
              .Config.Labels["avalon.static-base"] == $base and
              .Config.Labels["org.opencontainers.image.revision"] == $commit
            ' <<< "$metadata" > /dev/null; then
              digest_ref=$(jq -r '.[0].RepoDigests[0]' <<< "$metadata")
              echo "digest=${digest_ref##*@}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build and push the image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}-arm64
          build-args: STATIC_ASSET_BASE_URL=${{ env.STATIC_ASSET_BASE_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            avalon.static-base=${{ env.STATIC_ASSET_BASE_URL }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      # Static assets come from the pushed image itself, so the CDN and the application
      # serve the same build.
      - name: Extract static assets from the image
        id: image
        run: |
          image="$IMAGE_REPOSITORY@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}"
          docker pull --platform linux/arm64 "$image"
          # Legacy Node releases are permanently ineligible after the Rust cutover.
          runtime=$(docker image inspect "$image" --format '{{index .Config.Labels "avalon.runtime"}}')
          [[ $runtime == rust ]] || { echo "::error::Refusing a non-Rust release"; exit 1; }
          container=$(docker create "$image")
          docker cp "$container:/app/dist/client" "$RUNNER_TEMP/static"
          docker rm "$container"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      # Use deployment tooling from this workflow, even when deploying old commits.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: |
            deploy/release
            frontend/scripts/static
          persist-credentials: false

      - name: Publish static assets
        env:
          STATIC_BUILD_DIR: ${{ runner.temp }}/static
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --global wrangler@4.149.0
          node .release-tools/frontend/scripts/static/publish-static.mjs --upload
          node .release-tools/frontend/scripts/static/verify-static.mjs

      - name: Deploy to the ARM VM
        if: ${{ !inputs.prepare_only }}
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ vars.VM_SSH_KNOWN_HOSTS }}
          IMAGE: ${{ steps.image.outputs.ref }}
          RESTART: ${{ inputs.restart && '--restart' || '' }}
        run: |
          : "${VM_HOST:?}" "${VM_USER:?}" "${VM_SSH_PRIVATE_KEY:?}" "${VM_SSH_KNOWN_HOSTS:?}"
          umask 077
          credentials=$(mktemp -d)
          trap 'rm -rf "$credentials"' EXIT
          export VM_SSH_KEY_FILE="$credentials/key"
          export VM_SSH_KNOWN_HOSTS_FILE="$credentials/known_hosts"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$VM_SSH_KEY_FILE"
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > "$VM_SSH_KNOWN_HOSTS_FILE"
          unset VM_SSH_PRIVATE_KEY VM_SSH_KNOWN_HOSTS
          bash .release-tools/deploy/release/rollout.sh "$IMAGE" "$VERSION" ${RESTART:+"$RESTART"}

      - name: Summary
        if: success()
        run: |
          {
            echo "### ${{ inputs.prepare_only && 'Prepared' || 'Deployed' }} $VERSION"
            echo
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Commit: \`$COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

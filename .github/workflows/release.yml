name: Release
run-name: ${{ inputs.commit_title || github.event.head_commit.message || format('Release {0}', inputs.version || github.ref_name) }}

# Pushing a v1.2.3 tag on main releases it: checks, image, static assets, rollout.
# Running it by hand deploys the existing tag specified in the version input.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to deploy, independent of the selected workflow ref (e.g. v1.2.3)
        required: true
        type: string
      restart:
        description: Restart the pod even if this version is already running
        type: boolean
        default: false
      commit_title:
        description: Commit title supplied automatically by Release (manual)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || '' }}

  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      STATIC_ASSET_BASE_URL: ${{ vars.STATIC_ASSET_BASE_URL }}
      STATIC_R2_BUCKET: ${{ vars.STATIC_R2_BUCKET }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || '' }}
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $VERSION is not a version like v1.2.3"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$VERSION does not point to a commit on main"
            exit 1
          fi
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "registry=${IMAGE_REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: docker/login-action@v4
        with:
          registry: ${{ steps.tag.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v4

      # Each commit is built once. Re-runs and further tags on the same commit
      # reuse its image if it was built for the same static base.
      - name: Find an image built from this commit
        id: existing
        run: |
          ref="$IMAGE_REPOSITORY:sha-$COMMIT"
          if base=$(docker buildx imagetools inspect "$ref" --format '{{index .Image.Config.Labels "avalon.static-base"}}' 2>/dev/null) &&
            [[ $base == "$STATIC_ASSET_BASE_URL" ]]; then
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            docker buildx imagetools create -t "$IMAGE_REPOSITORY:$VERSION" "$IMAGE_REPOSITORY@$digest"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing $ref ($digest)"
          fi

      - name: Build and push the image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}
            ${{ env.IMAGE_REPOSITORY }}:sha-${{ env.COMMIT }}
          build-args: STATIC_ASSET_BASE_URL=${{ env.STATIC_ASSET_BASE_URL }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            avalon.static-base=${{ env.STATIC_ASSET_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Static assets come from the pushed image itself, so the CDN and the pod
      # serve the same build.
      - name: Extract static assets from the image
        id: image
        run: |
          image="$IMAGE_REPOSITORY@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}"
          docker pull "$image"
          container=$(docker create "$image")
          docker cp "$container:/app/dist/client" "$RUNNER_TEMP/static"
          docker rm "$container"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - name: Publish static assets
        env:
          STATIC_BUILD_DIR: ${{ runner.temp }}/static
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --global wrangler@4.149.0
          node scripts/publish-static.mjs --upload
          node scripts/verify-static.mjs

      - name: Roll out
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          K8S_ACCESS_HOSTNAME: ${{ vars.K8S_ACCESS_HOSTNAME }}
          K8S_CA_DATA: ${{ vars.K8S_CA_DATA }}
          K8S_TLS_SERVER_NAME: ${{ vars.K8S_TLS_SERVER_NAME }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'avalon' }}
          K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT || 'avalon' }}
          K8S_CONTAINER: ${{ vars.K8S_CONTAINER || 'avalon' }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          RESTART: ${{ inputs.restart && '--restart' || '' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" access tcp --hostname "$K8S_ACCESS_HOSTNAME" --url 127.0.0.1:6443 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          tunnel=$!
          trap 'kill "$tunnel" 2>/dev/null || true' EXIT

          umask 077
          cat > "$KUBECONFIG" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: production
              cluster:
                server: https://127.0.0.1:6443
                certificate-authority-data: $K8S_CA_DATA
                tls-server-name: ${K8S_TLS_SERVER_NAME:-kubernetes}
          users:
            - name: release
              user:
                token: $K8S_TOKEN
          contexts:
            - name: production
              context: { cluster: production, user: release, namespace: $K8S_NAMESPACE }
          current-context: production
          EOF

          # --raw skips API discovery, which retries each request five times.
          deployment_path="/apis/apps/v1/namespaces/$K8S_NAMESPACE/deployments/$K8S_DEPLOYMENT"
          for attempt in {1..40}; do
            kubectl get --raw "$deployment_path" --request-timeout=10s > /dev/null && break
            # A rejected service token makes cloudflared wait for a browser login.
            if grep -q "cdn-cgi/access/cli" "$RUNNER_TEMP/cloudflared.log"; then
              echo "::error::Access did not accept the service token for $K8S_ACCESS_HOSTNAME. Add a Service Auth policy that includes it to that Access application."
              cat "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi
            if [[ $attempt == 40 ]]; then
              echo "::error::Could not reach the cluster through $K8S_ACCESS_HOSTNAME"
              cat "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi
            sleep 5
          done

          deploy/release/rollout.sh "${{ steps.image.outputs.ref }}" "$VERSION" ${RESTART:+"$RESTART"}

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed $VERSION"
            echo
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Commit: \`$COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

name: Release
run-name: ${{ inputs.commit_title || format('Release {0}', inputs.commit) }}

# Releases are explicitly requested by commit; pushing a tag does not deploy.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA on main, or main for its latest commit
        required: true
        type: string
      restart:
        description: Restart the pod even if this version is already running
        type: boolean
        default: false
      commit_title:
        description: Commit title supplied automatically by Release (manual)
        type: string
        required: false
      prepare_only:
        description: Build and publish assets without changing the running deployment
        type: boolean
        default: false
      include_migration:
        description: Also publish the isolated one-shot legacy migration image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate commit
        id: resolve
        env:
          TARGET: ${{ inputs.commit }}
        run: |
          commit=$(bash deploy/release/resolve-commit.sh "$TARGET")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  release:
    needs: [resolve, checks]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PUBLIC_ORIGIN }}
    env:
      VERSION: sha-${{ needs.resolve.outputs.commit }}
      COMMIT: ${{ needs.resolve.outputs.commit }}
      STATIC_ASSET_BASE_URL: ${{ vars.STATIC_ASSET_BASE_URL }}
      STATIC_R2_BUCKET: ${{ vars.STATIC_R2_BUCKET }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - name: Set image repository
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_REPOSITORY=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Re-runs reuse the commit image if it was built for the same static base.
      - name: Find an image built from this commit
        id: existing
        run: |
          ref="$IMAGE_REPOSITORY:sha-$COMMIT"
          if base=$(docker buildx imagetools inspect "$ref" --format '{{index .Image.Config.Labels "avalon.static-base"}}' 2>/dev/null) &&
            [[ $base == "$STATIC_ASSET_BASE_URL" ]]; then
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing $ref ($digest)"
          fi

      - name: Build and push the image
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}
          build-args: STATIC_ASSET_BASE_URL=${{ env.STATIC_ASSET_BASE_URL }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            avalon.static-base=${{ env.STATIC_ASSET_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migration tool
        if: inputs.include_migration
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migration-tool
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:migration-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha

      # Static assets come from the pushed image itself, so the CDN and the pod
      # serve the same build.
      - name: Extract static assets from the image
        id: image
        run: |
          image="$IMAGE_REPOSITORY@${{ steps.existing.outputs.digest || steps.build.outputs.digest }}"
          docker pull "$image"
          # Legacy Node releases are permanently ineligible after the Rust cutover.
          runtime=$(docker image inspect "$image" --format '{{index .Config.Labels "avalon.runtime"}}')
          [[ $runtime == rust ]] || { echo "::error::Refusing a non-Rust release"; exit 1; }
          container=$(docker create "$image")
          docker cp "$container:/app/dist/client" "$RUNNER_TEMP/static"
          docker rm "$container"
          echo "ref=$image" >> "$GITHUB_OUTPUT"

      - name: Publish static assets
        env:
          STATIC_BUILD_DIR: ${{ runner.temp }}/static
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --global wrangler@4.149.0
          node scripts/publish-static.mjs --upload
          node scripts/verify-static.mjs

      # Use deployment tooling from this workflow, even when deploying old commits.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: deploy/release
          persist-credentials: false

      - name: Roll out
        if: ${{ !inputs.prepare_only }}
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          K8S_ACCESS_HOSTNAME: ${{ vars.K8S_ACCESS_HOSTNAME }}
          K8S_CA_DATA: ${{ vars.K8S_CA_DATA }}
          K8S_TLS_SERVER_NAME: ${{ vars.K8S_TLS_SERVER_NAME }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
          K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'avalon' }}
          K8S_DEPLOYMENT: ${{ vars.K8S_DEPLOYMENT || 'avalon' }}
          K8S_CONTAINER: ${{ vars.K8S_CONTAINER || 'avalon' }}
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          RESTART: ${{ inputs.restart && '--restart' || '' }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64
          chmod +x "$RUNNER_TEMP/cloudflared"
          "$RUNNER_TEMP/cloudflared" access tcp --hostname "$K8S_ACCESS_HOSTNAME" --url 127.0.0.1:6443 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          tunnel=$!
          trap 'kill "$tunnel" 2>/dev/null || true' EXIT

          umask 077
          cat > "$KUBECONFIG" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - name: production
              cluster:
                server: https://127.0.0.1:6443
                certificate-authority-data: $K8S_CA_DATA
                tls-server-name: ${K8S_TLS_SERVER_NAME:-kubernetes}
          users:
            - name: release
              user:
                token: $K8S_TOKEN
          contexts:
            - name: production
              context: { cluster: production, user: release, namespace: $K8S_NAMESPACE }
          current-context: production
          EOF

          # --raw skips API discovery, which retries each request five times.
          deployment_path="/apis/apps/v1/namespaces/$K8S_NAMESPACE/deployments/$K8S_DEPLOYMENT"
          for attempt in {1..40}; do
            kubectl get --raw "$deployment_path" --request-timeout=10s > /dev/null && break
            # A rejected service token makes cloudflared wait for a browser login.
            if grep -q "cdn-cgi/access/cli" "$RUNNER_TEMP/cloudflared.log"; then
              echo "::error::Access did not accept the service token for $K8S_ACCESS_HOSTNAME. Add a Service Auth policy that includes it to that Access application."
              cat "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi
            if [[ $attempt == 40 ]]; then
              echo "::error::Could not reach the cluster through $K8S_ACCESS_HOSTNAME"
              cat "$RUNNER_TEMP/cloudflared.log"
              exit 1
            fi
            sleep 5
          done

          .release-tools/deploy/release/rollout.sh "${{ steps.image.outputs.ref }}" "$VERSION" ${RESTART:+"$RESTART"}

      - name: Summary
        if: success()
        run: |
          {
            echo "### ${{ inputs.prepare_only && 'Prepared' || 'Deployed' }} $VERSION"
            echo
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Commit: \`$COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"

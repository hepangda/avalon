name: Release (manual)
run-name: Prepare release ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA on main, or main for its latest commit
        required: true
        default: main
        type: string
      restart:
        description: Restart the pod even if this version is already running
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      TARGET: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Start release with the commit title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESTART: ${{ inputs.restart }}
        run: |
          commit=$(bash deploy/release/resolve-commit.sh "$TARGET")
          title=$(git log -1 --format=%s "$commit")
          gh workflow run release.yml --ref main \
            -f commit="$commit" \
            -f restart="$RESTART" \
            -f commit_title="$title"
          {
            echo "### Release requested for $commit"
            echo
            echo "This entry workflow only starts the release; follow its checks and deployment in [Release](https://github.com/$GH_REPO/actions/workflows/release.yml)."
          } >> "$GITHUB_STEP_SUMMARY"

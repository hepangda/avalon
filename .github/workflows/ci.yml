name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Ref to check; defaults to the triggering commit
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: avalon_ci_only
          POSTGRES_DB: avalon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avalon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rust
      - run: npm run test:rust:legacy
      - name: Rust PostgreSQL and live socket integration
        env:
          AVALON_TEST_DATABASE_URL: postgres://postgres:avalon_ci_only@127.0.0.1:5432/postgres
          TEST_DATABASE_URL: postgres://postgres:avalon_ci_only@127.0.0.1:5432/avalon_test
        run: cargo test --locked --manifest-path backend/Cargo.toml --test storage_integration --test runtime_integration -- --ignored
      - name: One-way legacy cutover integration
        env:
          AVALON_TEST_DATABASE_URL: postgres://postgres:avalon_ci_only@127.0.0.1:5432/postgres
        run: cargo test --locked --features legacy-import --manifest-path backend/Cargo.toml --test migration_integration -- --ignored
      - run: cargo fmt --manifest-path backend/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets --features legacy-import -- -D warnings
      - run: npm run build:web

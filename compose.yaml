services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avalon
      POSTGRES_USER: avalon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalon -d avalon"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build:
      context: .
      args:
        STATIC_ASSET_BASE_URL: ${STATIC_ASSET_BASE_URL:-}
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
volumes:
  postgres-data:

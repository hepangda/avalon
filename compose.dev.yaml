name: avalon-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avalon_development
      POSTGRES_USER: avalon
      POSTGRES_PASSWORD: avalon_dev
    ports:
      - "127.0.0.1:${AVALON_DEV_DB_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avalon -d avalon_development"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:

[package]
name = "avalon-engine-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Development-only JSON bridge to the rules engine; never linked into the server.
[lib]
crate-type = ["cdylib"]

[dependencies]
avalon-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "avalon-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# No Tokio, SQLx or OS randomness: the same rules compile natively for the
# server and to wasm32 for the development gallery and frontend tests.
[dependencies]
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
rand_chacha = { version = "0.3", default-features = false }
sha2 = "0.10"
